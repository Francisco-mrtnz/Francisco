<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Francisco - Secret Carnival</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-secret">
    <header>
        <nav>
            <h1><a href="index.html">Francisco</a></h1>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a class="active" href="secret.html">Secret</a></li>
            </ul>
        </nav>
    </header>

    <main class="page-wrap">
        <section class="hero">
            <h2>Secret Carnival Game</h2>
            <p>Throw the same physics ball and hit as many random targets as you can.</p>
        </section>

        <section class="secret-score">
            <p class="secret-help">You have 2 minutes. Throw the ball into random targets and beat your best round.</p>
            <p>Time Left: <strong id="timeValue">02:00</strong></p>
            <p>Current Round: <strong id="scoreValue">0</strong></p>
            <p>High Score: <strong id="highScoreValue">0</strong></p>
            <button type="button" id="restartRoundBtn" class="restart-round" hidden>Play Again</button>
        </section>

        <section class="target-area" id="targetArea" aria-label="Hit the target carnival game area"></section>
    </main>

    <footer>
        <p>&copy; 2026 Francisco - Secret Arcade</p>
    </footer>

    <script src="physics-ball.js"></script>
    <script src="secret-hit.js"></script>
</body>
</html>
